<header class="nav" id="nav" data-ground="inv">
  <div class="nav__in">
    <a class="wordmark" href="index.html">ZENJI</a>
    <nav class="nav__links is-open" id="navLinks" aria-label="Primary">
      <a class="nav__link" href="collection.html#drop">Drop</a>
      <a class="nav__link" href="collection.html">Collection</a>
    </nav>
    <div class="nav__tools"><button class="icon-btn nav__burger" id="navToggle"></button></div>
  </div>
</header>
<pre id="out"></pre>
<script>
function lum(c){const m=c.match(/\d+/g).map(Number).slice(0,3).map(v=>{v/=255;return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*m[0]+0.7152*m[1]+0.0722*m[2];}
function cr(a,b){const l1=lum(a),l2=lum(b);const hi=Math.max(l1,l2),lo=Math.min(l1,l2);return ((hi+0.05)/(lo+0.05));}
const sheet=document.querySelector('.nav__links');
const link=document.querySelector('.nav__link');
const s=getComputedStyle(sheet), ls=getComputedStyle(link), ns=getComputedStyle(document.querySelector('.nav'));
const r={width:innerWidth, navColor:ns.color, sheetBg:s.backgroundColor, sheetColor:s.color,
  linkColor:ls.color, sheetPos:s.position, sheetDisplay:s.display, sheetVis:s.visibility,
  sheetClip:s.clipPath, sheetBorder:s.borderBottomColor,
  contrast:cr(ls.color, s.backgroundColor).toFixed(3)};
document.getElementById('out').textContent=JSON.stringify(r,null,1);
</script></body></html>
